<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ site.Title }}</title>
        {{ with site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}
        <link rel="stylesheet" href="{{ "/css/style.css" | relURL }}">
        <link rel="stylesheet" href="{{ "/css/custom.css" | relURL }}">
        {{ if fileExists "static/favicon.ico" }}<link rel="shortcut icon" type="image/x-icon" href="{{ "/favicon.ico" | relURL }}">{{ end }}
    </head>
    <body>
        <div class="wrapper">
            <header>
                <h1>{{ site.Title }}</h1>

                <p>{{ site.Params.shortbio }}</p>
                <p class="print-only"><a href="{{ site.BaseURL }}">{{ strings.TrimSuffix "/" (strings.TrimPrefix "https://" site.BaseURL) }}</a></p>

                <hr/>

                {{ partial "sidebar.html" . }}

                {{ with site.Params.logo }}
                <img src="{{ . | relURL }}" alt="Photo of {{ site.Title }}" />
                {{ end }}
            </header>
