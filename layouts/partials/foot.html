      <footer>
      </footer>
    </div>
    <script src="{{ "js/scale.fix.js" | relURL }}"></script>
    <script>
        function toggle(pid) {
            var absobj = document.getElementById("pubabs_" + pid);
            var linkobj = document.getElementById("pubabslink_" + pid);
            if (absobj.style.display === "none") {
                absobj.style.display = "inline";
                linkobj.style.display = "none";
            } else {
                absobj.style.display = "none";
                linkobj.style.display = "inline";
            }
        }
        (function () {
            var links = [];
            document.querySelectorAll('header p a[href^="#"]').forEach(function (a) {
                var heading = document.getElementById(a.getAttribute("href").slice(1));
                if (heading) links.push({ link: a, heading: heading });
            });
            if (!links.length) return;
            function update() {
                var current = links[0];
                var atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
                if (atBottom) {
                    current = links[links.length - 1];
                } else {
                    links.forEach(function (item) {
                        if (item.heading.getBoundingClientRect().top <= 140) current = item;
                    });
                }
                links.forEach(function (item) {
                    item.link.classList.toggle("active", item === current);
                });
            }
            window.addEventListener("scroll", update, { passive: true });
            window.addEventListener("resize", update);
            update();
        })();
        (function () {
            var root = document.documentElement;
            var button = document.getElementById("theme-toggle");
            function label() {
                var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
                button.setAttribute("aria-label", "Switch to " + next + " mode");
                button.setAttribute("title", "Switch to " + next + " mode");
            }
            label();
            button.addEventListener("click", function () {
                var t = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
                root.setAttribute("data-theme", t);
                try { localStorage.setItem("theme", t); } catch (e) {}
                label();
            });
        })();
    </script>
  </body>
</html>
