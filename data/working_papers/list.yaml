works:
  - title: "A Toast to Health? Cognitive Effects of Local Pesticide Regulations"
    # pdflink: "pdf/Rolle_pesticides.pdf"
    abstract: "Exploiting staggered regulatory changes in Veneto (Italy), I estimate the medium-term cognitive returns to reduced prenatal pesticide exposure: affected children score 0.2 standard deviations higher in math test scores relative to controls."

