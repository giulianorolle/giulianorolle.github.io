baseURL = "https://giulianorolle.github.io/"
relativeURLs = true
locale = "en"
defaultContentLanguage = "en"
title = "Giuliano Marco Federico Rolle"
theme = "academimal"
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  shortbio = "PhD Student in Applied Economics, Gran Sasso Science Institute (GSSI)"
  description = "Giuliano Marco Federico Rolle, PhD student in Applied Economics at GSSI. Environmental economics, health economics, applied microeconometrics."
  logo = "photo.jpg"
  # Shown in the menu only if the file exists in assets/
  cv = "pdf/Rolle_CV.pdf"
  # Picture shown at the very bottom of the page
  endimage = "img/mountains.jpg"
  endimage_alt = "Snow-covered mountains at sunset"

  # Page sections, in order. Each one is either a Markdown file in
  # content/sections/ ("page") or a list of papers in data/ ("data").
  # small = true renders the section in a smaller font;
  # image / image_alt show a picture above the section title.
  [[params.sections]]
    id = "bio"
    title = "Bio"
    page = "/sections/aboutme.md"
  [[params.sections]]
    id = "news"
    title = "News"
    page = "/sections/news.md"
  [[params.sections]]
    id = "workingpapers"
    title = "Working Papers"
    data = "working_papers"
  [[params.sections]]
    id = "presentations"
    title = "Presentations"
    page = "/sections/presentations.md"
  [[params.sections]]
    id = "education"
    title = "Education"
    page = "/sections/education.md"
  [[params.sections]]
    id = "researchassistance"
    title = "Research Assistance"
    data = "research_assistance"
    small = true
  [[params.sections]]
    id = "contact"
    title = "Contact"
    page = "/sections/contact.md"
